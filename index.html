<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />

<style>
:root{
  --bg:#f5f7f8;
  --card:#fff;
  --border:#e3e3e3;
  --green:#1d9e75;
  --green-dark:#0f6e56;
  --danger:#b42323;
  --text:#222;
  --muted:#777;
  --radius:16px;
}
*{box-sizing:border-box;margin:0;padding:0}
body{
  font-family:Inter,system-ui,sans-serif;
  background:var(--bg);
  color:var(--text);
}
button,input,select{
  font:inherit;
}
.app{
  max-width:1200px;
  margin:auto;
  min-height:100vh;
}
.topbar{
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:18px;
  background:#fff;
  border-bottom:1px solid var(--border);
  position:sticky;
  top:0;
  z-index:20;
}
.logo{
  display:flex;
  align-items:center;
  gap:12px;
}
.logo-circle{
  width:42px;
  height:42px;
  border-radius:50%;
  background:var(--green);
  color:white;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:20px;
}
.nav{
  display:flex;
  gap:8px;
  padding:14px 18px;
  overflow:auto;
}
.nav button{
  border:none;
  background:white;
  padding:10px 16px;
  border-radius:999px;
  cursor:pointer;
  border:1px solid var(--border);
}
.nav button.active{
  background:var(--green);
  color:white;
  border-color:var(--green);
}
.page{
  padding:18px;
}
.grid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(250px,1fr));
  gap:16px;
}
.card{
  background:var(--card);
  border-radius:var(--radius);
  border:1px solid var(--border);
  padding:16px;
}
.team-card{
  cursor:pointer;
  transition:.2s;
}
.team-card:hover{
  transform:translateY(-2px);
}
.badge{
  display:inline-flex;
  align-items:center;
  gap:6px;
  border-radius:999px;
  padding:4px 10px;
  background:#eff8f4;
  color:var(--green-dark);
  font-size:12px;
}
.btn{
  border:none;
  background:white;
  border:1px solid var(--border);
  border-radius:12px;
  padding:10px 14px;
  cursor:pointer;
}
.btn-primary{
  background:var(--green);
  color:white;
  border-color:var(--green);
}
.btn-danger{
  background:#ffe9e9;
  color:var(--danger);
  border-color:#ffcbcb;
}
.input{
  width:100%;
  padding:12px;
  border-radius:12px;
  border:1px solid var(--border);
  margin-top:6px;
}
.label{
  font-size:13px;
  color:var(--muted);
}
.modal-bg{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.5);
  display:flex;
  align-items:center;
  justify-content:center;
  z-index:100;
}
.modal{
  width:min(500px,92vw);
  max-height:90vh;
  overflow:auto;
  background:white;
  border-radius:24px;
  padding:24px;
}
.field{
  margin-bottom:14px;
}
.player-row{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:12px 0;
  border-bottom:1px solid var(--border);
}
.field-view{
  width:100%;
  max-width:420px;
  height:560px;
  border-radius:20px;
  margin:auto;
  background:linear-gradient(180deg,#2f7d45,#184d2d);
  position:relative;
  overflow:hidden;
}
.pos{
  position:absolute;
  transform:translate(-50%,-50%);
  text-align:center;
}
.pos-shirt{
  width:48px;
  height:48px;
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
  color:white;
  font-size:10px;
  font-weight:700;
  margin:auto;
  cursor:pointer;
}
.pos-name{
  color:white;
  font-size:10px;
  background:rgba(0,0,0,.45);
  border-radius:999px;
  padding:3px 8px;
  margin-top:4px;
}
.table-wrap{
  overflow:auto;
}
.table{
  width:100%;
  border-collapse:collapse;
}
.table th,.table td{
  padding:10px;
  border-bottom:1px solid var(--border);
  text-align:left;
}
.auth-screen{
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:24px;
}
.auth-box{
  width:min(420px,100%);
  background:white;
  border-radius:24px;
  padding:28px;
  border:1px solid var(--border);
}
.toast{
  position:fixed;
  right:20px;
  bottom:20px;
  background:black;
  color:white;
  padding:12px 18px;
  border-radius:12px;
  z-index:999;
}
@media(max-width:700px){
  .topbar{
    flex-direction:column;
    align-items:flex-start;
    gap:12px;
  }
}
</style>
</head>

  function generateShirt(teamName, color, role){

    P:'🧤',
    TD:'🛡️',
    TS:'🛡️',
    DC:'🛡️',
    CC:'⚙️',
    CDC:'⚙️',
    COC:'🎯',
    AD:'⚡',
    AS:'⚡',
    ATT:'🔥'
  };

  const initials = teamName
    .split(' ')
    .map(w => w[0])
    .join('')
    .substring(0,3)
    .toUpperCase();

  return `
    <div style="
      width:42px;
      height:42px;
      border-radius:50%;
      background:${color};
      display:flex;
      flex-direction:column;

      <div style="font-size:12px">
        ${roleMap[role] || '⚽'}
      </div>

      <div>
        ${initials}
      </div>
    </div>
  `;
}

// ==========================================
// HELPERS
// ==========================================
function qs(s){return document.querySelector(s)}
function ce(tag){return document.createElement(tag)}

function toast(message){
  const root = qs('#toast-root');
  const el = ce('div');
  el.className = 'toast';
  el.textContent = message;
  root.appendChild(el);
  setTimeout(()=>el.remove(),2500);
}

function openModal(render){
  state.modal = render;
  renderApp();
}

function closeModal(){
  state.modal = null;
  renderApp();
}

function currentTeam(){
  return state.teams.find(t=>t.id===state.selectedTeam);
}

function teamPlayers(teamId){
  return state.players.filter(p=>p.team_id===teamId);
}

function lineupPlayer(teamId,key){
  const row = state.lineups.find(l=>l.team_id===teamId && l.position_key===key);
  if(!row) return null;
  return state.players.find(p=>p.id===row.player_id);
}

function getBenchPlayer(teamId,slot){
  const row = state.bench.find(
    b => b.team_id===teamId && b.slot===slot
  );

  if(!row) return null;

  return state.players.find(p=>p.id===row.player_id);
}

function isAdmin(){
  return state.profile?.role === 'admin';
}

async function silentRefresh(){

  const [
    teamsRes,
    playersRes,
    matchesRes,
    lineupsRes,
    benchRes
  ] = await Promise.all([
    supabaseClient.from('teams').select('*').order('id'),
    supabaseClient.from('players').select('*').order('name'),
    supabaseClient.from('matches').select('*').order('matchday'),
    supabaseClient.from('lineups').select('*'),
    supabaseClient.from('bench').select('*')
  ]);

  state.teams = teamsRes.data || [];
  state.players = playersRes.data || [];
  state.matches = matchesRes.data || [];
  state.lineups = lineupsRes.data || [];
  state.bench = benchRes.data || [];

  // evita rerender aggressivo mentre scrivi nei form
  const active = document.activeElement;
  const typing =
    active &&
    (active.tagName === 'INPUT' ||
     active.tagName === 'TEXTAREA' ||
     active.tagName === 'SELECT');

  if(!typing){
    renderApp();
  }
}
  
  

async function bootstrap(){
  state.loading = true;
  renderApp();

  const { data:{user} } = await supabaseClient.auth.getUser();

  if(!user){
    state.loading = false;
    renderApp();
    return;
  }

  state.user = user;

const [
  profileRes,
  teamsRes,
  playersRes,
  matchesRes,
  lineupsRes,
  benchRes
] = await Promise.all([
  supabaseClient.from('profiles').select('*').eq('id',user.id).single(),
  supabaseClient.from('teams').select('*').order('id'),
  supabaseClient.from('players').select('*').order('name'),
  supabaseClient.from('matches').select('*').order('matchday'),
  supabaseClient.from('lineups').select('*'),
  supabaseClient.from('bench').select('*')
]);

  state.profile = profileRes.data;
  state.teams = teamsRes.data || [];
  state.players = playersRes.data || [];
  state.matches = matchesRes.data || [];
  state.lineups = lineupsRes.data || [];
  state.bench = benchRes.data || [];

  let realtimeChannel = null;

function subscribeRealtime(){

  if(realtimeChannel){
    supabaseClient.removeChannel(realtimeChannel);
  }

  realtimeChannel = supabaseClient
    .channel('db-changes')

    .on('postgres_changes',
      {event:'*',schema:'public',table:'players'},
      () => silentRefresh()
    )

    .on('postgres_changes',
      {event:'*',schema:'public',table:'teams'},
      () => silentRefresh()
    )

    .on('postgres_changes',
      {event:'*',schema:'public',table:'matches'},
      () => silentRefresh()
    )

    .on('postgres_changes',
      {event:'*',schema:'public',table:'lineups'},
      () => silentRefresh()
    )

    .on('postgres_changes',
      {event:'*',schema:'public',table:'bench'},
      () => silentRefresh()
    )

    .subscribe();
}

  state.loading = false;
  renderApp();
}

// ==========================================
// REALTIME
// ==========================================
function subscribeRealtime(){
  supabaseClient
  .channel('db-changes')
  .on('postgres_changes',{event:'*',schema:'public',table:'players'}, silentRefresh)
  .on('postgres_changes',{event:'*',schema:'public',table:'teams'}, silentRefresh)
  .on('postgres_changes',{event:'*',schema:'public',table:'matches'}, silentRefresh)
  .on('postgres_changes',{event:'*',schema:'public',table:'lineups'}, silentRefresh)
  .on('postgres_changes',{event:'*',schema:'public',table:'bench'}, silentRefresh)
  .subscribe();
}

async function createPlayer(){
  const payload = {
    team_id:Number(qs('#p-team').value),
    name:qs('#p-name').value,
    role:qs('#p-role').value,
    ovr:Number(qs('#p-ovr').value || 0),
    value:Number(qs('#p-value').value || 0),
    goals:0,
    assists:0,
    injured:false
  };

  const { error } = await supabaseClient.from('players').insert(payload);

  if(error){
    toast(error.message);
    return;
  }

  closeModal();
  toast('Giocatore creato');
}

async function saveLineup(teamId,positionKey,playerId){

  await supabaseClient
  .from('lineups')
  .delete()
  .eq('team_id',teamId)
  .eq('player_id',playerId);

  const existing = state.lineups.find(l=>l.team_id===teamId && l.position_key===positionKey);

  if(existing){
    await supabaseClient
    .from('lineups')
    .update({player_id:playerId})
    .eq('id',existing.id);
  }else{
    await supabaseClient
    .from('lineups')
    .insert({
      team_id:teamId,
      position_key:positionKey,
      player_id:playerId
    });
  }

  closeModal();
  toast('Formazione aggiornata');
}

async function saveBench(teamId,slot,playerId){

  const existing = state.bench.find(
    b => b.team_id===teamId && b.slot===slot
  );

  if(existing){

    await supabaseClient
      .from('bench')
      .update({player_id:playerId})
      .eq('id',existing.id);

  } else {

    await supabaseClient
      .from('bench')
      .insert({
        team_id:teamId,
        slot,
        player_id:playerId
      });

  }

  closeModal();
  toast('Panchina aggiornata');
}

async function createResult(){
  const payload = {
    matchday:Number(qs('#m-day').value),
    home_team:Number(qs('#m-home').value),
    away_team:Number(qs('#m-away').value),
    home_goals:Number(qs('#m-hg').value),
    away_goals:Number(qs('#m-ag').value),

}

async function deleteMatch(id){

  const confirmDelete = confirm('Eliminare il risultato?');

  if(!confirmDelete) return;

  const { error } = await supabaseClient
    .from('matches')
    .delete()
    .eq('id', id);

  if(error){
    toast(error.message);
    return;
  }

  toast('Risultato eliminato');

async function deletePlayer(id){
  if(!confirm('Eliminare il giocatore?')) return;
  const { error } = await supabaseClient.from('players').delete().eq('id', id);
  if(error){ toast(error.message); return; }
  toast('Giocatore eliminato');
}

function renderStandings(){

  const standings = state.teams.map(team=>{

    let pts=0;
    let gf=0;
    let ga=0;

    state.matches.forEach(match=>{

      if(!match.played) return;

      if(match.home_team===team.id){
        gf += match.home_goals;
        ga += match.away_goals;

        if(match.home_goals>match.away_goals) pts += 3;
        else if(match.home_goals===match.away_goals) pts += 1;
      }

      if(match.away_team===team.id){
        gf += match.away_goals;
        ga += match.home_goals;

        if(match.away_goals>match.home_goals) pts += 3;
        else if(match.away_goals===match.home_goals) pts += 1;
      }

    });

    return {
      ...team,
      pts,
      gf,
      ga,
      diff:gf-ga
    };

  }).sort((a,b)=>b.pts-a.pts || b.diff-a.diff);

  return `
    <div class="card table-wrap">
      <table class="table">
        <thead>
          <tr>
            <th>#</th>
            <th>Squadra</th>
            <th>GF</th>
            <th>GA</th>
            <th>DR</th>
            <th>PTS</th>
          </tr>
        </thead>

        <tbody>
          ${standings.map((t,i)=>`
            <tr>
              <td>${i+1}</td>
              <td><strong>${t.name}</strong></td>
              <td>${t.gf}</td>
              <td>${t.ga}</td>
              <td>${t.diff}</td>
              <td><strong>${t.pts}</strong></td>
            </tr>
          `).join('')}
        </tbody>
      </table>
    </div>
  `;
}

  return `
    <div class="modal-bg" onclick="closeModalBackground(event)">
      <div class="modal">
        ${state.modal()}
      </div>
    </div>
  `;
}

function renderApp(){

  const app = qs('#app');
  const modalRoot = qs('#modal-root');

  if(state.loading){
    app.innerHTML = '<div style="padding:40px">Caricamento...</div>';
    return;
  }

  if(!state.user){
    app.innerHTML = renderLogin();
    return;
  }

  app.innerHTML = `

    <div class="app">

      <div class="topbar">
        <div class="logo">
          <div class="logo-circle">
            <i class="ti ti-ball-football"></i>
          </div>

          <div>
            <h2>Lega FC26 Pro</h2>
            <div style="font-size:13px;color:var(--muted)">
              ${state.profile?.username || ''}
            </div>
          </div>
        </div>

        <div style="display:flex;gap:10px;flex-wrap:wrap">

          ${isAdmin() ? `
            <button class="btn btn-primary" onclick="openResultModal()">
              + Risultato
            </button>
          `:''}

          <button class="btn" onclick="logout()">
            Logout
          </button>

        </div>
      </div>

      <div class="nav">
        <button class="${state.page==='home'?'active':''}" onclick="navigate('home')">Home</button>
        <button class="${state.page==='teams'?'active':''}" onclick="navigate('teams')">Squadre</button>
        <button class="${state.page==='standings'?'active':''}" onclick="navigate('standings')">Classifica</button>
        <button class="${state.page==='matches'?'active':''}" onclick="navigate('matches')">Risultati</button>
        <button class="${state.page==='calendar'?'active':''}" onclick="navigate('calendar')">Calendario</button>
      </div>

      <div class="page">

        ${state.selectedTeam
          ? renderTeamDetail()
          : state.page==='home'
            ? renderHome()
            : state.page==='teams'
              ? renderTeams()
              : state.page==='matches'
                ? renderMatches()
                : state.page==='calendar'
                  ? renderCalendar()
                  : renderStandings()

        }

      </div>

    </div>

  `;

  modalRoot.innerHTML = renderModal();
}

// ==========================================
// NAVIGATION
// ==========================================

let draggedPlayerId = null;

function dragPlayer(event, playerId){
  draggedPlayerId = playerId;
}

function allowDrop(event){
  event.preventDefault();
}

async function dropPlayer(event, teamId, positionKey){

  event.preventDefault();

  if(!draggedPlayerId) return;

  await saveLineup(teamId, positionKey, draggedPlayerId);

  draggedPlayerId = null;
}
function navigate(page){
  state.page = page;
  state.selectedTeam = null;
  renderApp();
}

function openTeam(id){
  state.selectedTeam = id;
  renderApp();
}

function goBack(){
  state.selectedTeam = null;
  renderApp();
}

function renderPlayersGroup(title, players){

  if(players.length === 0){
    return '';
  }

  return `

    <div style="margin-bottom:22px">

      <h3 style="
        margin-bottom:12px;
        padding-bottom:8px;
        border-bottom:1px solid var(--border);
      ">
        ${title}
      </h3>

      ${players.map(player => `

        <div class="player-row"
          draggable="true"
          ondragstart="dragPlayer(event, ${player.id})">

          <div style="display:flex;align-items:center;gap:10px">

            ${
              player.photo_url
              ? `
                <img
                  src="${player.photo_url}"
                  style="
                    width:42px;
                    height:42px;
                    border-radius:50%;
                    object-fit:cover;
                    border:2px solid #eee;
                  "
                >
              `
              : generateShirt(team.name, team.color, player.role)
            }

            <div>
              <strong>${player.name}</strong>

              <div style="font-size:12px;color:var(--muted)">
                ${ROLES[player.role] || player.role}
              </div>
            </div>

          </div>

          <div style="display:flex;gap:8px;align-items:center">

            <div class="badge">
              OVR ${player.ovr}
            </div>

            ${isAdmin() ? `

              <button class="btn"
                style="padding:6px 10px;font-size:12px"
                onclick="openEditPlayer(${player.id})">
                ✏️
              </button>

              <button class="btn btn-danger"
                style="padding:6px 10px;font-size:12px"
                onclick="deletePlayer(${player.id})">
                🗑️
              </button>

            ` : ''}

          </div>

        </div>

      `).join('')}

    </div>

  `;
}

// ==========================================
// MODALS
// ==========================================
function closeModalBackground(e){
  if(e.target.classList.contains('modal-bg')){
    closeModal();
  }
}

function openCreatePlayer(){
  openModal(()=>`

    <h2 style="margin-bottom:18px">Nuovo Giocatore</h2>

    <div class="field">
      <label class="label">Squadra</label>
      <select id="p-team" class="input">
        ${state.teams.map(t=>`<option value="${t.id}">${t.name}</option>`).join('')}
      </select>
    </div>

    <div class="field">
      <label class="label">Nome</label>
      <input id="p-name" class="input" />
    </div>

    <div class="field">
      <label class="label">Ruolo</label>
      <select id="p-role" class="input">
        ${Object.entries(ROLES).map(([k,v])=>`<option value="${k}">${v}</option>`).join('')}
      </select>
    </div>

    <div class="field">
      <label class="label">OVR</label>
      <input id="p-ovr" class="input" type="number" />
    </div>

    <div class="field">
      <label class="label">Valore</label>
      <input id="p-value" class="input" type="number" />
    </div>

    <div style="display:flex;gap:10px;margin-top:18px">
      <button class="btn" onclick="closeModal()">Annulla</button>
      <button class="btn btn-primary" onclick="createPlayer()">Salva</button>
    </div>

  `);
}

function chooseLineupPlayer(teamId,positionKey){

  const players = teamPlayers(teamId);

  openModal(()=>`

    <h2 style="margin-bottom:18px">Seleziona giocatore</h2>

    <div style="margin-bottom:24px">
  ${renderPlayersGroup(
    'Portieri',
    players.filter(p => p.role === 'P')
  )}

  ${renderPlayersGroup(
    'Difensori',
    players.filter(p =>
      ['TD','TS','DC'].includes(p.role)
    )
  )}

  ${renderPlayersGroup(
    'Centrocampisti',
    players.filter(p =>
      ['CC','CDC','COC'].includes(p.role)
    )
  )}

  ${renderPlayersGroup(
    'Attaccanti',
    players.filter(p =>
      ['AD','AS','ATT'].includes(p.role)
    )
  )}
</div>
  `);
}

function chooseBenchPlayer(teamId, slot){

  const players = teamPlayers(teamId);

  openModal(()=>`

    <h2 style="margin-bottom:18px">Seleziona riserva</h2>

${renderPlayersGroup('Portieri', players.filter(p => p.role === 'P'))}

${renderPlayersGroup('Difensori',
  players.filter(p =>
    ['TD','TS','DC'].includes(p.role)
  )
)}

${renderPlayersGroup('Centrocampisti',
  players.filter(p =>
    ['CC','CDC','COC'].includes(p.role)
  )
)}

${renderPlayersGroup('Attaccanti',
  players.filter(p =>
    ['AD','AS','ATT'].includes(p.role)
  )
)}

  `);
}

async function dropBenchPlayer(event, teamId, slot){

  event.preventDefault();

  if(!draggedPlayerId) return;

  await saveBench(teamId, slot, draggedPlayerId);

  draggedPlayerId = null;
}

function openEditPlayer(playerId){
  const player = state.players.find(p => p.id === playerId);
  if(!player) return;

  openModal(() => `
    <h2 style="margin-bottom:18px">Modifica Giocatore</h2>
    <input type="hidden" id="ep-id" value="${player.id}" />

    <div class="field">
      <label class="label">Nome</label>
      <input id="ep-name" class="input" value="${player.name}" />
    </div>

    <div class="field">
      <label class="label">Squadra</label>
      <select id="ep-team" class="input">
        ${state.teams.map(t => `<option value="${t.id}" ${t.id === player.team_id ? 'selected' : ''}>${t.name}</option>`).join('')}
      </select>
    </div>

    <div class="field">
      <label class="label">Ruolo</label>
      <select id="ep-role" class="input">
        ${Object.entries(ROLES).map(([k,v]) => `<option value="${k}" ${k === player.role ? 'selected' : ''}>${v}</option>`).join('')}
      </select>
    </div>

    <div class="field">
      <label class="label">OVR</label>
      <input id="ep-ovr" class="input" type="number" value="${player.ovr}" />
    </div>

    <div class="field">
      <label class="label">Valore (crediti)</label>
      <input id="ep-value" class="input" type="number" value="${player.value}" />
    </div>

    <div class="field">
      <label class="label">Infortunato</label>
      <select id="ep-injured" class="input">
        <option value="false" ${!player.injured ? 'selected' : ''}>No</option>
        <option value="true" ${player.injured ? 'selected' : ''}>Sì</option>
      </select>
    </div>

    <div style="display:flex;gap:10px;margin-top:18px">
      <button class="btn" onclick="closeModal()">Annulla</button>
      <button class="btn btn-primary" onclick="updatePlayer()">Salva</button>
    </div>
  `);
}

function openEditTeam(teamId){
  const team = state.teams.find(t => t.id === teamId);
  if(!team) return;

  openModal(() => `
    <h2 style="margin-bottom:18px">Modifica Squadra</h2>
    <input type="hidden" id="et-id" value="${team.id}" />

    <div class="field">
      <label class="label">Formazione</label>
      <select id="et-formation" class="input" onchange="updateFormationPreview(this.value)">
        ${Object.keys(FORMATIONS).map(f => `<option value="${f}" ${f === team.formation ? 'selected' : ''}>${f}</option>`).join('')}
      </select>
      <div id="formation-preview" style="font-size:12px;color:var(--muted);margin-top:6px">
        ${FORMATIONS[team.formation].length - 1} giocatori di movimento + 1 portiere
      </div>
    </div>

    <div class="field">
      <label class="label">Crediti rimanenti</label>
      <input id="et-credits" class="input" type="number" value="${team.credits ?? 0}" />
    </div>

    <div style="display:flex;gap:10px;margin-top:18px">
      <button class="btn" onclick="closeModal()">Annulla</button>
      <button class="btn btn-primary" onclick="updateTeam()">Salva</button>
    </div>
  `);
}

function updateFormationPreview(formation){
  const el = document.getElementById('formation-preview');
  if(el && FORMATIONS[formation]){
    el.textContent = `${FORMATIONS[formation].length - 1} giocatori di movimento + 1 portiere`;
  }
}

function openResultModal(){

  openModal(()=>`

    <h2 style="margin-bottom:18px">Nuovo Risultato</h2>

    <div class="field">
      <label class="label">Giornata</label>
      <input id="m-day" class="input" type="number" value="1" />
    </div>

    <div class="field">
      <label class="label">Casa</label>
      <select id="m-home" class="input">
        ${state.teams.map(t=>`<option value="${t.id}">${t.name}</option>`).join('')}
      </select>
    </div>

    <div class="field">
      <label class="label">Gol Casa</label>
      <input id="m-hg" class="input" type="number" value="0" />
    </div>

    <div class="field">
      <label class="label">Ospite</label>
      <select id="m-away" class="input">
        ${state.teams.map(t=>`<option value="${t.id}">${t.name}</option>`).join('')}
      </select>
    </div>

    <div class="field">
      <label class="label">Gol Ospite</label>
      <input id="m-ag" class="input" type="number" value="0" />
    </div>

    <div style="display:flex;gap:10px;margin-top:18px">
      <button class="btn" onclick="closeModal()">Annulla</button>
      <button class="btn btn-primary" onclick="createResult()">Salva</button>
    </div>

  `);

}

// ==========================================
// START
// ==========================================
bootstrap();

</script>
</body>
</html>
